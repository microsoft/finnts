name: Feature request
description: Suggest a new feature or improvement for the finnts R package.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the forecasting problem first, then the change you would like.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like finnts to handle it, for example a new argument, model, or function.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Data size, date type, links, or examples. Do not include confidential data.
